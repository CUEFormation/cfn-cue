Resources:
  Bucket:
    Type: AWS::S3::Bucket
  Policy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: Read
          Effect: Allow
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${Bucket.Arn}/a/*
          Principal: '*'
        - Sid: Read
          Effect: Allow
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${Bucket.Arn}/b/*
          Principal: '*'
