Parameters:
  Env:
    Type: String
    AllowedValues:
    - prod
    - dev
Conditions:
  Prod:
    Fn::Equals:
    - Ref: Env
    - prod
  Dev:
    Fn::Equals:
    - Ref: Env
    - dev
Resources:
  A:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::GetAtt:
        - B
        - QueueName
  B:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${C}-b
  C:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Ref: A
