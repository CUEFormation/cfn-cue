Parameters:
  Name:
    Type: String
Conditions:
  Named:
    Fn::Not:
    - Fn::Equals:
      - Ref: Name
      - ''
Resources:
  Group:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '1'
      MaxSize: '2'
      AvailabilityZones:
      - us-east-1a
      LaunchTemplate:
        LaunchTemplateId: lt-0123456789abcdef0
        Version: '1'
    UpdatePolicy:
      Fn::If:
      - Named
      - AutoScalingRollingUpdate:
          MinInstancesInService: 1
      - Ref: AWS::NoValue
