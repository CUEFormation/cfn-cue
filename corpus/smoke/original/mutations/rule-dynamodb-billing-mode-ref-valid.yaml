Parameters:
  Mode:
    Type: String
    AllowedValues:
    - PAY_PER_REQUEST
    - PROVISIONED
Resources:
  Thing:
    Type: AWS::DynamoDB::Table
    Properties:
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      BillingMode:
        Ref: Mode
