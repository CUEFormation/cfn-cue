Parameters:
  Name:
    Type: String
Conditions:
  Named:
    Fn::Not:
    - Fn::Equals:
      - Ref: Name
      - ''
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      Fn::If:
      - Named
      - BucketName:
          Ref: Name
        AccessControl: DefinitelyNotAnACL
      - Ref: AWS::NoValue
